<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .widget {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .widget:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .widget h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .dark-mode .widget {
            background: rgba(30, 30, 50, 0.95);
        }

        .dark-mode .widget h2 {
            color: #fff;
            border-bottom-color: #764ba2;
        }

        /* Weather Widget */
        .weather-display {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .weather-row {
            background: rgba(102, 126, 234, 0.1);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dark-mode .weather-row {
            background: rgba(118, 75, 162, 0.2);
            border-left-color: #764ba2;
        }

        .weather-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-main-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .dark-mode .weather-main-text {
            color: #fff;
        }

        .weather-secondary-text {
            font-size: 1rem;
            color: #666;
        }

        .dark-mode .weather-secondary-text {
            color: #aaa;
        }

        .weather-right {
            font-size: 1rem;
            color: #666;
        }

        .dark-mode .weather-right {
            color: #aaa;
        }

        /* Time Display */
        .time-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 5rem;
            font-weight: bold;
            color: white;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .weather-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .weather-status-icon {
            width: 50px;
            height: 50px;
        }

        .weather-status-text {
            font-size: 1.5rem;
        }

        .alarm-display {
            text-align: center;
            font-size: 1.2rem;
            color: white;
            margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .alarm-display.hidden {
            display: none;
        }

        .timer-display {
            text-align: center;
            font-size: 1.2rem;
            color: white;
            margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .timer-display.hidden {
            display: none;
        }

        .nav-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .nav-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.3);
        }

        .lock-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .lock-button:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Bus Widget */
        .bus-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bus-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .dark-mode .bus-item {
            background: rgba(118, 75, 162, 0.2);
            border-left-color: #764ba2;
        }

        .bus-line {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }

        .dark-mode .bus-line {
            color: #a78bfa;
        }

        .bus-destination {
            color: #333;
            margin: 5px 0;
        }

        .dark-mode .bus-destination {
            color: #ddd;
        }

        .bus-time {
            color: #666;
            font-size: 0.9rem;
        }

        .dark-mode .bus-time {
            color: #aaa;
        }

        .bus-delay {
            color: #e74c3c;
            font-weight: bold;
        }

        .bus-on-time {
            color: #27ae60;
            font-weight: bold;
        }

        .bus-vehicle {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
            cursor: pointer;
        }

        .dark-mode .bus-vehicle {
            color: #777;
        }

        .bus-vehicle:hover {
            color: #667eea;
        }

        .dark-mode .bus-vehicle:hover {
            color: #a78bfa;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 15px 20px;
            background: #667eea;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-body {
            flex: 1;
            overflow: hidden;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .no-departures {
            color: #999;
            text-align: center;
            padding: 20px;
        }

        .dark-mode .no-departures {
            color: #777;
        }

        /* Uptime Widget */
        .uptime-status {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .uptime-up {
            background: #27ae60;
            color: white;
        }

        .uptime-down {
            background: #e74c3c;
            color: white;
        }

        .uptime-error {
            background: #f39c12;
            color: white;
        }

        .uptime-unknown {
            background: #95a5a6;
            color: white;
        }

        .uptime-url {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .dark-mode .uptime-url {
            color: #aaa;
        }

        .uptime-websites {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .uptime-website {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 8px;
        }

        .dark-mode .uptime-website {
            background: rgba(118, 75, 162, 0.2);
        }

        .uptime-website-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .dark-mode .uptime-website-name {
            color: #fff;
        }

        .uptime-website-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
        }

        .site-info {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .dark-mode .site-info {
            background: rgba(118, 75, 162, 0.2);
        }

        .site-info-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .dark-mode .site-info-title {
            color: #fff;
        }

        .site-info-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .site-info-stat {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 5px;
        }

        .dark-mode .site-info-stat {
            background: rgba(0, 0, 0, 0.2);
        }

        .site-info-stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .dark-mode .site-info-stat-value {
            color: #a78bfa;
        }

        .site-info-stat-label {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }

        .dark-mode .site-info-stat-label {
            color: #aaa;
        }

        .user-increase {
            background: #27ae60;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 5px;
            vertical-align: super;
        }

        /* Loading state */
        .loading {
            text-align: center;
            color: #999;
        }

        .dark-mode .loading {
            color: #777;
        }

        /* Simplified dark mode */
        body.simplified-dark-mode .widget:not(.bus-widget):not(.uptime-widget):not(.services-widget) {
            display: none;
        }

        /* Services Widget */
        .services-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .service-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .dark-mode .service-item {
            background: rgba(118, 75, 162, 0.2);
            border-left-color: #764ba2;
        }

        .service-name {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }

        .dark-mode .service-name {
            color: #a78bfa;
        }

        .service-info {
            color: #333;
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .dark-mode .service-info {
            color: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/alarms'">⏰ Alarms</button>
            <button class="nav-btn" onclick="window.location.href='/timer'">⏱️ Timer</button>
        </div>
        <button class="lock-button" onclick="window.location.href='/lock'">🔒 Lock</button>
        
        <div class="header">
            <h1>Dashboard</h1>
            <div class="time-display" id="time-display">
                <div class="weather-status" id="weather-status">
                    <div class="loading">Loading...</div>
                </div>
                <div id="clock-time">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            <div class="alarm-display hidden" id="alarm-display">
                Alarm: <span id="alarm-time">Not set</span>
            </div>
            <div class="timer-display hidden" id="timer-display">
                Timer: <span id="timer-time">00:00:00</span>
            </div>
        </div>

        <div class="dashboard">
            <!-- Bus Widget -->
            <div class="widget bus-widget">
                <h2>Next Bus Departures</h2>
                <div class="bus-list" id="bus-display">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <!-- Uptime Widget -->
            <div class="widget uptime-widget">
                <h2>Website Info</h2>
                <div id="uptime-display">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <!-- Services Widget -->
            <div class="widget services-widget">
                <h2>Services</h2>
                <div id="services-display">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Journey Modal -->
    <div class="modal" id="journey-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Bus Journey</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <iframe id="journey-iframe" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        // Audio context for ding sound
        let audioContext = null;

        // Modal functions
        function openJourneyModal(journeyId) {
            const modal = document.getElementById('journey-modal');
            const iframe = document.getElementById('journey-iframe');
            iframe.src = `https://bustimes.org/journeys/${journeyId}`;
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('journey-modal');
            const iframe = document.getElementById('journey-iframe');
            iframe.src = '';
            modal.classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('journey-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        function playDing() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Fetch functions
        async function fetchWeather() {
            try {
                const response = await fetch('/api/weather');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching weather:', error);
                return null;
            }
        }

        async function fetchTime() {
            try {
                const response = await fetch('/api/time');
                const data = await response.json();
                return data.time;
            } catch (error) {
                console.error('Error fetching time:', error);
                return null;
            }
        }

        async function fetchBuses() {
            try {
                const response = await fetch('/api/buses');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching buses:', error);
                return null;
            }
        }

        async function fetchUptime() {
            try {
                const response = await fetch('/api/uptime');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching uptime:', error);
                return null;
            }
        }

        async function fetchAlarms() {
            try {
                const response = await fetch('/api/alarms');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching alarms:', error);
                return null;
            }
        }

        async function fetchAlarmTriggered() {
            try {
                const response = await fetch('/api/alarm-triggered');
                const data = await response.json();
                return data.triggered;
            } catch (error) {
                console.error('Error fetching alarm triggered status:', error);
                return false;
            }
        }

        async function fetchTimer() {
            try {
                const response = await fetch('/api/timers');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching timer:', error);
                return null;
            }
        }

        async function fetchLockState() {
            try {
                const response = await fetch('/api/lock');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching lock state:', error);
                return null;
            }
        }

        async function fetchServices() {
            try {
                const response = await fetch('/api/services');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching services:', error);
                return null;
            }
        }

        let isRedirecting = false;

        // Display functions
        function displayWeather(data) {
            // Weather is now displayed next to clock via displayWeatherStatus
            // This function is kept for sunrise/sunset calculation
        }

        function displayTime(time) {
            const display = document.getElementById('clock-time');
            if (!time) {
                display.innerHTML = '<div class="loading">Error loading time</div>';
                return;
            }
            display.innerHTML = time;
        }

        function displayWeatherStatus(data) {
            const display = document.getElementById('weather-status');
            if (!data) {
                display.innerHTML = '<div class="loading">Error loading weather</div>';
                return;
            }
            display.innerHTML = `
                <img src="/static/icons/${data.icon}.png" alt="${data.description}" class="weather-status-icon">
                <span class="weather-status-text">${data.description} ${Math.round(data.app_temp)}°</span>
            `;
        }

        function displayAlarm(alarmData) {
            const display = document.getElementById('alarm-display');
            const timeDisplay = document.getElementById('alarm-time');
            
            if (!alarmData) {
                display.classList.add('hidden');
                return;
            }
            
            // Check if it's past midnight (show alarm from 00:00 onwards)
            const now = new Date();
            const hour = now.getHours();
            
            if (hour >= 0 && hour < 12) { // Show from midnight to noon
                display.classList.remove('hidden');
                if (alarmData.enabled && alarmData.time) {
                    timeDisplay.textContent = alarmData.time;
                } else {
                    timeDisplay.textContent = 'Not set';
                }
            } else {
                display.classList.add('hidden');
            }
        }

        function formatTimerTime(seconds) {
            if (seconds === null || seconds === undefined) return null;
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function displayTimer(timerData) {
            const display = document.getElementById('timer-display');
            const timeDisplay = document.getElementById('timer-time');
            
            if (!timerData || !timerData.duration) {
                display.classList.add('hidden');
                return;
            }
            
            // Only show timer if it's running or paused
            if (timerData.running || timerData.paused) {
                display.classList.remove('hidden');
                timeDisplay.textContent = formatTimerTime(timerData.remaining);
            } else {
                display.classList.add('hidden');
            }
        }

        function displayBuses(buses) {
            const display = document.getElementById('bus-display');
            if (!buses) {
                display.innerHTML = '<div class="loading">Error loading buses</div>';
                return;
            }

            if (buses.length === 0) {
                display.innerHTML = '<div class="no-departures">No Departures</div>';
                return;
            }

            // Function to parse ISO 8601 duration and convert to minutes
            function parseDurationToMinutes(duration) {
                if (!duration) return null;
                
                // Parse format like P0DT00H01M19S
                const match = duration.match(/P(?:(\d+)D)?T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
                if (!match) return null;
                
                const days = parseInt(match[1] || '0', 10);
                const hours = parseInt(match[2] || '0', 10);
                const minutes = parseInt(match[3] || '0', 10);
                const seconds = parseInt(match[4] || '0', 10);
                
                const totalMinutes = (days * 24 * 60) + (hours * 60) + minutes + (seconds / 60);
                return totalMinutes;
            }

            let html = '';
            for (const bus of buses) {
                let delayText = '';
                if (bus.delay) {
                    const delayMinutes = parseDurationToMinutes(bus.delay);
                    if (delayMinutes !== null) {
                        if (Math.abs(delayMinutes) < 0.5) {
                            delayText = ` <span class="bus-on-time">On time</span>`;
                        } else {
                            delayText = ` <span class="bus-delay">(${delayMinutes.toFixed(1)} min)</span>`;
                        }
                    }
                }
                const vehicleText = bus.vehicle && bus.journey_id ? 
                    `<div class="bus-vehicle" onclick="openJourneyModal(${bus.journey_id})">${bus.vehicle}</div>` : 
                    (bus.vehicle ? `<div class="bus-vehicle">${bus.vehicle}</div>` : '');
                
                // Parse the time to display just the time
                const timeObj = new Date(bus.aimed_time);
                const timeStr = timeObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                
                const localityText = bus.locality ? ` - ${bus.locality}` : '';
                
                html += `
                    <div class="bus-item">
                        <div class="bus-line">${bus.line}${localityText}</div>
                        <div class="bus-time">${timeStr}${delayText}</div>
                        ${vehicleText}
                    </div>
                `;
            }
            display.innerHTML = html;
        }

        let lastEeveeitStatus = null;
        let lastJellyfinStatus = null;
        let lastAlarmTriggered = false;

        function playAlarmSound() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Play a more prominent alarm sound
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 880; // Higher pitch for alarm
            oscillator.type = 'square'; // More aggressive sound
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
            
            // Play a second beep
            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.frequency.value = 880;
                osc2.type = 'square';
                gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.3);
            }, 400);
        }

        function displayServices(data) {
            const display = document.getElementById('services-display');
            if (!data) {
                display.innerHTML = '<div class="loading">Error loading services</div>';
                return;
            }

            if (data.length === 0) {
                display.innerHTML = '<div class="no-departures">No services available</div>';
                return;
            }

            let html = '<div class="services-list">';
            for (const service of data) {
                html += `
                    <div class="service-item">
                        <div class="service-name">${service.name}</div>
                        <div class="service-info">${service.info}</div>
                    </div>
                `;
            }
            html += '</div>';
            display.innerHTML = html;
        }

        function displayUptime(data) {
            const display = document.getElementById('uptime-display');
            if (!data) {
                display.innerHTML = '<div class="loading">Error loading uptime</div>';
                return;
            }

            // Check eeveeit.uk status changes
            if (lastEeveeitStatus !== null && lastEeveeitStatus !== data.eeveeit.status && data.eeveeit.status_changed) {
                playDing();
            }
            lastEeveeitStatus = data.eeveeit.status;

            // Check jellyfin status changes
            if (lastJellyfinStatus !== null && lastJellyfinStatus !== data.jellyfin.status && data.jellyfin.status_changed) {
                playDing();
            }
            lastJellyfinStatus = data.jellyfin.status;

            const eeveeitStatusClass = `uptime-${data.eeveeit.status}`;
            const eeveeitStatusText = data.eeveeit.status.toUpperCase();

            const jellyfinStatusClass = `uptime-${data.jellyfin.status}`;
            const jellyfinStatusText = data.jellyfin.status.toUpperCase();

            let siteInfoHtml = '';
            if (data.site_info.services > 0 || data.site_info.operators > 0 || data.site_info.vehicles > 0 || data.site_info.users > 0) {
                const userIncreaseIndicator = data.site_info.users_increased ? 
                    '<span class="user-increase">+1</span>' : '';
                
                siteInfoHtml = `
                    <div class="site-info">
                        <div class="site-info-title">Site Statistics</div>
                        <div class="site-info-stats">
                            <div class="site-info-stat">
                                <div class="site-info-stat-value">${data.site_info.services}</div>
                                <div class="site-info-stat-label">Services</div>
                            </div>
                            <div class="site-info-stat">
                                <div class="site-info-stat-value">${data.site_info.operators}</div>
                                <div class="site-info-stat-label">Operators</div>
                            </div>
                            <div class="site-info-stat">
                                <div class="site-info-stat-value">${data.site_info.vehicles}</div>
                                <div class="site-info-stat-label">Vehicles</div>
                            </div>
                            <div class="site-info-stat">
                                <div class="site-info-stat-value">${data.site_info.users}${userIncreaseIndicator}</div>
                                <div class="site-info-stat-label">Users</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Add Uptime Kuma monitor groups if available
            let uptimeKumaHtml = '';
            if (data.uptime_kuma && data.uptime_kuma.groups && Object.keys(data.uptime_kuma.groups).length > 0) {
                const groupsHtml = Object.values(data.uptime_kuma.groups).map(group => {
                    // Determine overall status based on if any monitor is down
                    const hasDown = group.monitors.some(m => m.status_text === 'down');
                    const hasPending = group.monitors.some(m => m.status_text === 'pending');
                    const hasUnknown = group.monitors.some(m => m.status_text === 'unknown');
                    
                    let statusText = 'UP';
                    if (hasDown) statusText = 'DOWN';
                    else if (hasPending) statusText = 'PENDING';
                    else if (hasUnknown) statusText = 'UNKNOWN';
                    
                    const statusClass = `uptime-${statusText.toLowerCase()}`;
                    const uptimePercent = (group.overall_uptime * 100).toFixed(2);
                    
                    return `
                        <div class="uptime-website">
                            <div class="uptime-website-name">${group.name}</div>
                            <div class="uptime-website-status ${statusClass}">${statusText}</div>
                            <div class="uptime-url">Uptime: ${uptimePercent}% (${group.monitor_count} monitors)</div>
                        </div>
                    `;
                }).join('');
                
                uptimeKumaHtml = `
                    <div class="site-info">
                        <div class="site-info-title">Uptime Kuma Groups</div>
                        <div class="uptime-websites">
                            ${groupsHtml}
                        </div>
                    </div>
                `;
            }

            display.innerHTML = `
                <div class="uptime-websites">
                    <div class="uptime-website">
                        <div class="uptime-website-name">eeveeit.uk</div>
                        <div class="uptime-website-status ${eeveeitStatusClass}">${eeveeitStatusText}</div>
                    </div>
                    <div class="uptime-website">
                        <div class="uptime-website-name">jellyfin.eeveeit.uk</div>
                        <div class="uptime-website-status ${jellyfinStatusClass}">${jellyfinStatusText}</div>
                    </div>
                </div>
                ${siteInfoHtml}
                ${uptimeKumaHtml}
            `;
        }

        // Sunset/Sunrise calculation
        let weatherData = null;

        function calculateSunriseSunset() {
            // Use actual sunrise/sunset from weather API if available
            if (weatherData && weatherData.sunrise && weatherData.sunset) {
                try {
                    const now = new Date();
                    const sunriseTime = new Date();
                    const sunsetTime = new Date();
                    
                    // Parse sunrise time (format: "HH:MM")
                    const sunriseMatch = weatherData.sunrise.match(/(\d+):(\d+)/);
                    if (sunriseMatch) {
                        const hours = parseInt(sunriseMatch[1]);
                        const minutes = parseInt(sunriseMatch[2]);
                        sunriseTime.setHours(hours, minutes, 0, 0);
                    }
                    
                    // Parse sunset time (format: "HH:MM")
                    const sunsetMatch = weatherData.sunset.match(/(\d+):(\d+)/);
                    if (sunsetMatch) {
                        const hours = parseInt(sunsetMatch[1]);
                        const minutes = parseInt(sunsetMatch[2]);
                        sunsetTime.setHours(hours, minutes, 0, 0);
                    }
                    
                    return { sunrise: sunriseTime, sunset: sunsetTime };
                } catch (e) {
                    console.error('Error parsing sunrise/sunset:', e);
                }
            }
            
            // Fallback to approximation
            const now = new Date();
            const month = now.getMonth();
            
            const sunriseHour = 6 + Math.sin((month - 3) * Math.PI / 6) * 2;
            const sunsetHour = 18 + Math.sin((month - 3) * Math.PI / 6) * 2;
            
            return {
                sunrise: new Date(now.setHours(sunriseHour, 0, 0, 0)),
                sunset: new Date(now.setHours(sunsetHour, 0, 0, 0))
            };
        }

        function updateDarkMode() {
            const now = new Date();
            const { sunrise, sunset } = calculateSunriseSunset();
            
            const isNight = now < sunrise || now > sunset;
            
            if (isNight) {
                document.body.classList.add('dark-mode');
                document.body.classList.add('simplified-dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
                document.body.classList.remove('simplified-dark-mode');
            }
        }

        // Update all data
        async function updateAll() {
            const lockState = await fetchLockState();
            if (lockState && lockState.locked) {
                window.location.href = '/locked';
                return;
            }

            const weather = await fetchWeather();
            weatherData = weather; // Store for sunrise/sunset calculation
            displayWeatherStatus(weather);
            displayWeather(weather);

            const time = await fetchTime();
            displayTime(time);

            const buses = await fetchBuses();
            displayBuses(buses);

            const uptime = await fetchUptime();
            displayUptime(uptime);

            const alarms = await fetchAlarms();
            displayAlarm(alarms);

            const timer = await fetchTimer();
            displayTimer(timer);

            const services = await fetchServices();
            displayServices(services);

            const alarmTriggered = await fetchAlarmTriggered();
            if (alarmTriggered && !lastAlarmTriggered) {
                playAlarmSound();
            }
            lastAlarmTriggered = alarmTriggered;

            updateDarkMode();
        }

        // Initial load
        updateAll();

        // Update time every second
        setInterval(async () => {
            const time = await fetchTime();
            displayTime(time);
            updateDarkMode();
        }, 1000);

        // Check alarm trigger status every second
        setInterval(async () => {
            const alarmTriggered = await fetchAlarmTriggered();
            if (alarmTriggered && !lastAlarmTriggered) {
                playAlarmSound();
            }
            lastAlarmTriggered = alarmTriggered;
        }, 1000);

        // Update timer display every second when running
        setInterval(async () => {
            const timer = await fetchTimer();
            if (timer && (timer.running || timer.paused)) {
                displayTimer(timer);
            }
        }, 1000);

        // Check lock state every 5 seconds
        setInterval(async () => {
            if (isRedirecting) return;
            
            const lockState = await fetchLockState();
            if (lockState && lockState.locked) {
                isRedirecting = true;
                window.location.href = '/locked';
            }
        }, 5000);

        // Update other data every 30 seconds
        setInterval(updateAll, 30000);
    </script>
